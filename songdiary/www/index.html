<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F2EF">
<meta name="format-detection" content="telephone=no">
<title>소리일기 · 나의 노래 연습 기록</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <img class="brand-mark" src="icon.svg" alt="" width="34" height="34" aria-hidden="true">
    <div class="tb-brand"><h1 class="tb-title" id="tb-title">소리일기</h1><p class="tb-subtitle" id="tb-subtitle">나의 노래 연습 기록</p></div>
    <button class="tb-timer" id="tb-timer" hidden aria-label="연습 중인 날로 가기"><span class="dot"></span><span id="tb-timer-t">0:00</span></button>
    <button class="save-state" id="save-state"></button>
    <button class="icon-btn" id="btn-settings" aria-label="설정"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></span></button>
  </div>
</header>
<main id="view"></main>
<nav class="tabbar" aria-label="메뉴">
  <div class="tabbar-in" role="tablist">
    <button class="tab" role="tab" data-tab="today" aria-selected="true"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></span>오늘</button>
    <button class="tab" role="tab" data-tab="calendar" aria-selected="false"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>달력</button>
    <button class="tab" role="tab" data-tab="feedback" aria-selected="false"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h16v10.5H9.5L5 20v-4H4z"/><path d="M8 9.5h8M8 12.5h5"/></svg></span>피드백</button>
    <button class="tab" role="tab" data-tab="songs" aria-selected="false"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="15" height="18" rx="2.5"/><path d="M8 3v18M3 7h4M3 12h4M3 17h4M13 14V8l4-1v6"/><circle cx="11.5" cy="14" r="1.5"/><circle cx="15.5" cy="13" r="1.5"/></svg></span>기록</button>
  </div>
</nav>
<div class="now-playing" id="now-playing" hidden>
  <button class="np-play" data-state="" aria-label="재생"></button>
  <button class="np-t" aria-label="이 녹음이 있는 날로 가기"></button>
  <span class="np-time"></span>
  <button class="np-x" aria-label="재생 멈추고 닫기"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></span></button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-audio" hidden multiple accept="audio/*,video/mp4,.m4a,.amr,.3gp,.aac,.opus,.flac">
<input type="file" id="file-json" hidden accept=".zip,.json,application/zip,application/json,application/x-zip-compressed">
<script>
/* in-app update: the copy being tried notes that it started; if it doesn't get as far as its first screen
   within 15 s, go back to the copy before it (and don't offer this version again) */
(function () { try {
  var K = 'songdiary:v1:ota', C = window.Capacitor;
  var get = function () { try { return JSON.parse(localStorage.getItem(K) || 'null'); } catch (e) { return null; } };
  var s0 = get();
  if (!s0 || !s0.pending || !C || !C.nativePromise) return;
  C.nativePromise('WebView', 'getServerBasePath', {}).then(function (r) {
    var m = /\/ota\/v(\d+)\/?$/.exec(String((r && r.path) || ''));
    if (!m || +m[1] !== s0.pending) return; /* the copy running is not the one being tried */
    var s = get();
    if (!s || s.pending !== s0.pending) return;
    s.started = s.pending; s.tries = s.tries || {}; s.tries[s.pending] = (s.tries[s.pending] || 0) + 1;
    localStorage.setItem(K, JSON.stringify(s));
    var elapsed = 0, last = Date.now(), active = document.visibilityState !== 'hidden';
    var visibility = function () { active = document.visibilityState !== 'hidden'; last = Date.now(); };
    document.addEventListener('visibilitychange', visibility);
    var watch = setInterval(function () {
      var now = Date.now(); if (active) elapsed += now - last; last = now;
      var t = get();
      if (window.__sdBooted || !t || t.pending !== s0.pending) { clearInterval(watch); document.removeEventListener('visibilitychange', visibility); return; }
      if (elapsed < 15000) return; /* time spent in Recents / another app isn't a failed boot */
      clearInterval(watch); document.removeEventListener('visibilitychange', visibility);
      var p = t.prev || { type: 'asset' };
      t.bad = t.pending; delete t.pending; delete t.pendingPath; delete t.prev; delete t.started; if (t.tries) delete t.tries[s0.pending];
      localStorage.setItem(K, JSON.stringify(t));
      if (p.type === 'file') C.nativePromise('WebView', 'setServerBasePath', { path: p.path });
      else C.nativePromise('WebView', 'setServerAssetPath', { path: 'public' });
    }, 500);
  }).catch(function () { /* nothing to undo */ });
} catch (e) { /* nothing to undo */ } })();
</script>
<script src="native.js"></script>
<script src="songsearch.js"></script>
<script src="scales.js"></script>
<script src="piano.js"></script>
<script src="practice.js"></script>
<script src="update.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
