# 노래일기: every push that changes the app builds its APK and puts it in your Google Drive (like ReaderaPlus).
# Drive side: a small Apps Script web app in your own Google account (songdiary/tools/gdrive/upload.gs, steps in its
# header) and two secrets, SONGDIARY_DRIVE_URL and SONGDIARY_DRIVE_KEY. Until they exist the job only says so.
# The signing key is made on the first build and kept in that Drive folder, never in git or in the Actions cache
# (this repository is public: a fork's pull request could read the cache).
name: 노래일기 APK → Google Drive

on:
  push:
    paths:
      - 'songdiary/www/**'
      - 'songdiary/tools/build_apk.py'
      - 'songdiary/tools/drive_apk.py'
      - '.github/workflows/songdiary-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdiary-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONGDIARY_DRIVE_URL: ${{ secrets.SONGDIARY_DRIVE_URL }}
      SONGDIARY_DRIVE_KEY: ${{ secrets.SONGDIARY_DRIVE_KEY }}
    steps:
      - name: Google Drive set up?
        id: on
        run: |
          if [ -n "$SONGDIARY_DRIVE_URL" ] && [ -n "$SONGDIARY_DRIVE_KEY" ]; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::SONGDIARY_DRIVE_URL / SONGDIARY_DRIVE_KEY secrets are not set yet: no APK this time (songdiary/tools/gdrive/upload.gs)"; fi

      - uses: actions/checkout@v4
        if: steps.on.outputs.on == 'true'

      - uses: actions/setup-python@v5
        if: steps.on.outputs.on == 'true'
        with:
          python-version: '3.12'

      - name: Build APK
        if: steps.on.outputs.on == 'true'
        id: build
        run: |
          pip install -q cryptography
          name="$(python3 -c "import json; print(json.load(open('songdiary/www/release.json'))['version'])")"
          code="$(python3 -c "import json; print(json.load(open('songdiary/www/release.json'))['code'])")"
          python3 songdiary/tools/drive_apk.py base --out "$RUNNER_TEMP/base.apk"
          python3 songdiary/tools/drive_apk.py key --out-dir "$RUNNER_TEMP/sign"
          apk="$RUNNER_TEMP/노래일기-$name.apk"
          SONGDIARY_STOREPASS="$(cat "$RUNNER_TEMP/sign/storepass")" python3 songdiary/tools/build_apk.py \
            --base "$RUNNER_TEMP/base.apk" --www songdiary/www --keystore "$RUNNER_TEMP/sign/release.p12" \
            --version-name "$name" --version-code "$code" --out "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Google Drive
        if: steps.on.outputs.on == 'true'
        run: python3 songdiary/tools/drive_apk.py upload --file "${{ steps.build.outputs.apk }}"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/sign" "$RUNNER_TEMP/base.apk"
